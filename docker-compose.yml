# Onyx reverse proxy — docker-compose example
#
# Quick start:
#   docker compose up -d
#   docker compose exec onyx /onyx setup
#
services:
  onyx:
    image: ghcr.io/elchi-dev/onyx:latest
    # Or build locally:
    # build: .
    container_name: onyx
    restart: unless-stopped
    ports:
      - "80:80"       # HTTP proxy + ACME challenges
      - "443:443"     # HTTPS proxy
      - "8080:8080"   # Dashboard
    volumes:
      - onyx-data:/data
    environment:
      # Override default data dir so config and DB go to the volume.
      - ONYX_DATA_DIR=/data

volumes:
  onyx-data:
    driver: local
